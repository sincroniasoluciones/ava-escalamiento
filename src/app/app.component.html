<main class="app-shell">
  <header class="app-shell__header">
    <div class="app-shell__hero">
      <div class="app-shell__brand" aria-label="AVA">
        <span class="app-shell__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 3 21 19h-4.1l-1.5-2.9H8.6L7.1 19H3L12 3Zm-2 10.1h4L12 9.2l-2 3.9Z" />
          </svg>
        </span>
        <div class="app-shell__title">
          <span>AVA</span>
          <h1>Asistente de Escalamiento Operativo</h1>
        </div>
      </div>

      <p class="app-shell__description">Consulta procedimientos, descartes y rutas de escalamiento en segundos.</p>

      <div class="app-shell__signals" aria-label="Capacidades">
        <span>Procedimientos</span>
        <span>Rutas críticas</span>
        <span>Historial del turno</span>
      </div>

      <svg class="app-shell__visual" viewBox="0 0 280 160" aria-hidden="true">
        <path d="M38 54h132c14 0 25 11 25 25v19c0 14-11 25-25 25H38c-14 0-25-11-25-25V79c0-14 11-25 25-25Z" />
        <path d="M105 18h126c11 0 20 9 20 20v12c0 11-9 20-20 20H105c-11 0-20-9-20-20V38c0-11 9-20 20-20Z" />
        <path d="M122 88h114c12 0 22 10 22 22s-10 22-22 22H122c-12 0-22-10-22-22s10-22 22-22Z" />
        <circle cx="58" cy="88" r="10" />
        <circle cx="132" cy="44" r="7" />
        <circle cx="214" cy="110" r="8" />
      </svg>
    </div>
  </header>

  <section class="app-shell__section app-shell__section--search" aria-label="Buscador">
    <app-buscador />
  </section>

  <div class="app-shell__workspace">
    <section class="app-shell__section app-shell__section--result" aria-label="Resultado">
      <app-resultado />
    </section>

    <section class="app-shell__section app-shell__section--history" aria-label="Historial">
      <app-historial />
    </section>
  </div>
</main>
