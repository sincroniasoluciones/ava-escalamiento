<main class="app-shell">
  <header class="app-shell__header">
    <div class="app-shell__brand" aria-label="AVA">
      <span class="app-shell__logo" aria-hidden="true">AVA</span>
      <h1>{{ appName() }}</h1>
    </div>
  </header>

  <section class="app-shell__section app-shell__section--search" aria-label="Buscador">
    <app-buscador />
  </section>

  <section class="app-shell__section app-shell__section--result" aria-label="Resultado">
    <app-resultado />
  </section>

  <section class="app-shell__section app-shell__section--history" aria-label="Historial">
    <app-historial />
  </section>
</main>
