name: Deploy AVA to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build -- --configuration=production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ava-escalamiento/browser

      - uses: actions/deploy-pages@v4
